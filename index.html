<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230b1329'/><circle cx='32' cy='32' r='24' fill='none' stroke='%231e293b' stroke-width='1.5' stroke-dasharray='3 3'/><line x1='32' y1='8' x2='32' y2='56' stroke='%231e3a5f' stroke-width='1'/><line x1='8' y1='32' x2='56' y2='32' stroke='%231e3a5f' stroke-width='1'/><polygon points='32 14 50 48 32 40 14 48' fill='%230284c7' fill-opacity='0.4' stroke='%2338bdf8' stroke-width='2.5' stroke-linejoin='round'/><circle cx='32' cy='14' r='3.5' fill='%2338bdf8'/><circle cx='50' cy='48' r='3' fill='%2338bdf8'/><circle cx='14' cy='48' r='3' fill='%2338bdf8'/><circle cx='32' cy='32' r='2.5' fill='%23f59e0b'/></svg>" />
    <!-- 移动端视口与无缝全屏适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>标绘系统</title>
    <!-- MapTalks GL 官方 CDN 引入 (通过 link 与 script 方式) -->
    <link rel="stylesheet" href="https://maptalks.com/api/maptalks-gl.css" />
    <script type="text/javascript" src="https://maptalks.com/api/maptalks-gl.js"></script>
    <script>
      try {
        var t = localStorage.getItem('geoplot_studio_theme_mode');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          t = 'light';
        }
        if (t === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-gray-950 text-slate-800 dark:text-gray-100 overflow-hidden select-none touch-manipulation transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
