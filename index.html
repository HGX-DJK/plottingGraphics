<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><path d='M14 22 L24 20 L24 46 L14 48 Z' fill='%23e2e8f0'/><path d='M24 20 L34 22 L34 48 L24 46 Z' fill='%23cbd5e1'/><path d='M34 22 L44 20 L44 46 L34 48 Z' fill='%23ffffff'/><path d='M18 40 L28 34 L38 31' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round'/><circle cx='18' cy='40' r='2' fill='%230284c7'/><path d='M28 34 C26 31 23 28 23 24 A5 5 0 1 1 33 24 C33 28 30 31 28 34 Z' fill='%23ef4444'/><circle cx='28' cy='22' r='1.8' fill='%23ffffff'/><path d='M40 29 L46 23 L48 25 L42 31 Z' fill='%23f8fafc' stroke='%230284c7' stroke-width='0.8'/><path d='M38 31 L40 29 L42 31 Z' fill='%23f59e0b'/><circle cx='38' cy='31' r='1' fill='%23fde047'/></svg>" />
    <!-- 移动端视口与无缝全屏适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>标绘系统</title>
    <!-- MapTalks GL 官方 CDN 引入 (通过 link 与 script 方式)
         说明: 引擎脚本与样式均采用非阻塞加载。CDN 抖动或不可达时，
         页面仍能立即渲染登录页与「引擎加载中」遮罩，而不会整页白屏。 -->
    <link rel="preconnect" href="https://maptalks.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://maptalks.com/api/maptalks-gl.css"
      media="print"
      onload="this.media='all'"
    />
    <script type="text/javascript" src="https://maptalks.com/api/maptalks-gl.js" async></script>
    <script>
      try {
        var t = localStorage.getItem('geoplot_studio_theme_mode');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          t = 'light';
        }
        if (t === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-gray-950 text-slate-800 dark:text-gray-100 overflow-hidden select-none touch-manipulation transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
