<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><polygon points='12 2 19 21 12 17 5 21 12 2'/></svg>" />
    <!-- 移动端视口与无缝全屏适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>GeoPlot GIS - 移动端矢量标绘与空间数据采集系统 (MapTalks GL)</title>
    <!-- MapTalks GL 官方 CDN 引入 (通过 link 与 script 方式) -->
    <link rel="stylesheet" href="https://maptalks.com/api/maptalks-gl.css" />
    <script type="text/javascript" src="https://maptalks.com/api/maptalks-gl.js"></script>
    <script>
      try {
        var t = localStorage.getItem('geoplot_studio_theme_mode');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          t = 'light';
        }
        if (t === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-gray-950 text-slate-800 dark:text-gray-100 overflow-hidden select-none touch-manipulation transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
